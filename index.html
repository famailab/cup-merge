<script>
"use strict";
/* ================= CUP MERGE · 推杯合并 ================= */
const VERSION="1.4";
const LW = 440, LH = 800;               // logical canvas size
const TABLE = { x:16, y:148, w:408, h:568 };   // play field
const LAUNCH_Y = 648;
const TIER_N = 10;

// ---- tier data ----
const TIERS = [
  null,
  { name:"纸杯",    coin:5   },
  { name:"橙汁",    coin:12  },
  { name:"抹茶",    coin:22  },
  { name:"蓝汽水",  coin:36  },
  { name:"奶昔",    coin:55  },
  { name:"葡萄饮",  coin:80  },
  { name:"柠檬气泡",coin:115 },
  { name:"彩虹鸡尾酒",coin:160},
  { name:"玛格丽特",coin:220 },
  { name:"提基杯",  coin:320 },
];
const tierRadius = t => 25 * Math.pow(1.115, t - 1);
const tierMass = t => Math.pow(tierRadius(t), 2) / 625;

// ---- utils ----
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,k)=>a+(b-a)*k;
const easeOutCubic=k=>1-Math.pow(1-k,3);
const PHYS_F=0.72; // physics radius = 72% of sprite: cups overlap/occlude like real ones
const FB=(s,w=800)=>`${w} ${s}px "Baloo 2", ui-rounded, system-ui, sans-serif`;
const STR={
zh:{ best:"最佳", combo:"连击", next:"下一个", orders:"外卖订单", hint:"按住移动，松手发射",
  feverMsg:"FEVER!! 双倍金币", orderDone:"订单完成! +",
  subtitle:"推杯换盏", start:"开 始", resume:"继 续", restart:"重新开始", paused:"已暂停",
  howto:"👆 按住杯子左右移动，松手发射<br>🥤 撞到相同的杯子 → 合成更大的饮料<br>🏝️ 一路合成到终极提基杯，订单赚钱停不下来",
  helpBtn:"玩法说明", helpTitle:"玩法说明", close:"关闭",
  help:[["🎯 目标","合成越来越大的饮料，完成外卖订单赚金币，一路做到终极提基杯！"],
  ["👆 操作","按住杯子左右拖动，松手向上发射。"],
  ["🥤 合成","两个相同的杯子一碰就合成大一号。"],
  ["🛵 外卖订单","按订单做出指定饮料，交货拿小费。"],
  ["🔥 连击","短时间内连续合成可提高金币倍率，最高 x8。"],
  ["⚡ FEVER","合成积攒闪电能量，攒满进入 12 秒双倍金币！"]]},
en:{ best:"BEST", combo:"COMBO", next:"NEXT", orders:"ORDERS", hint:"HOLD · DRAG · RELEASE",
  feverMsg:"FEVER!! DOUBLE COINS", orderDone:"ORDER DONE! +",
  subtitle:"PUSH · MERGE · SIP", start:"START", resume:"RESUME", restart:"RESTART", paused:"PAUSED",
  howto:"👆 Hold the cup, drag left / right, release to launch<br>🥤 Same cups merge into a bigger drink on contact<br>🏝️ Merge all the way to the legendary Tiki — orders pay nonstop",
  helpBtn:"HOW TO PLAY", helpTitle:"HOW TO PLAY", close:"CLOSE",
  help:[["🎯 GOAL","Merge drinks into bigger ones, complete delivery orders for coins, and work your way up to the legendary Tiki!"],
  ["👆 CONTROLS","Press, drag left / right, release to launch the cup upward."],
  ["🥤 MERGE","Two identical cups merge into the next size on first contact."],
  ["🛵 ORDERS","Serve exactly what each order asks for to earn tips."],
  ["🔥 COMBO","Chain merges quickly to boost the coin multiplier — up to x8."],
  ["⚡ FEVER","Merges charge the bolt meter. Fill it for 12 seconds of DOUBLE coins!"]]}};
const T=k=>STR[G.lang][k];
// pre-rendered soft shadow (radial gradient, no hard edge)
const SHADOW_IMG=(()=>{
  const c=document.createElement("canvas"); c.width=c.height=128;
  const g=c.getContext("2d");
  const grd=g.createRadialGradient(64,64,6,64,64,62);
  grd.addColorStop(0,"rgba(46,23,8,.36)");
  grd.addColorStop(0.55,"rgba(46,23,8,.16)");
  grd.addColorStop(1,"rgba(46,23,8,0)");
  g.fillStyle=grd; g.fillRect(0,0,128,128);
  return c;
})();
function drawShadow(x,y,r,alpha=1){
  const w=r*2.0, h=r*0.9;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.drawImage(SHADOW_IMG, x-w/2+r*0.16, y+r*0.38-h/2, w, h);
  ctx.restore();
}
const rand = (a,b)=>a+Math.random()*(b-a);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};

// ---- audio ----
const AudioSys = {
  ctx:null, master:null, muted:false, cache:{},
  init(){
    if(this.ctx) return;
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(this.ctx.destination);
      this.muted = localStorage.getItem("cupmerge_mute")==="1";
      updateMuteBtn();
      const files = ["whoosh","pop","coin","click","fanfare","fever","thud",
        ...Array.from({length:11},(_,i)=>"clink"+String(i+1).padStart(2,"0"))];
      for(const f of files){
        fetch("assets/sfx/"+f+".mp3").then(r=>r.arrayBuffer())
          .then(b=>this.ctx.decodeAudioData(b)).then(d=>{this.cache[f]=d;})
          .catch(()=>{});
      }
    }catch(e){}
  },
  resume(){ if(this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  play(name, vol=1, rate=1){
    if(!this.ctx || this.muted || !this.cache[name]) return;
    try{
      const s = this.ctx.createBufferSource();
      s.buffer = this.cache[name]; s.playbackRate.value = rate;
      const g = this.ctx.createGain(); g.gain.value = vol;
      s.connect(g); g.connect(this.master); s.start();
    }catch(e){}
  },
  clink(impact){ // impact 0..1
    const n = 1 + Math.floor(Math.random()*11);
    this.play("clink"+String(n).padStart(2,"0"), 0.25+impact*0.75, rand(0.92,1.12));
  }
};
// __MORE__

/* ================= state ================= */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let DPR = 1, SCALE = 1, OX = 0, OY = 0;

function resize(){
  DPR = Math.min(2.5, window.devicePixelRatio || 1);
  const ww = window.innerWidth, wh = window.innerHeight;
  SCALE = Math.min(ww / LW, wh / LH);
  canvas.width = Math.round(LW * SCALE * DPR);
  canvas.height = Math.round(LH * SCALE * DPR);
  canvas.style.width = Math.round(LW * SCALE) + "px";
  canvas.style.height = Math.round(LH * SCALE) + "px";
  OX = (ww - LW * SCALE) / 2; OY = (wh - LH * SCALE) / 2;
  const wrap = document.getElementById("wrap");
  canvas.style.position = "absolute";
  canvas.style.left = OX + "px"; canvas.style.top = OY + "px";
}
window.addEventListener("resize", resize); resize();

function toLogical(cx, cy){
  const r = canvas.getBoundingClientRect();
  return { x:(cx - r.left) / r.width * LW, y:(cy - r.top) / r.height * LH };
}

const G = {
  running:false, paused:false, time:0,
  cups:[], particles:[], floaters:[], events:[],
  coins:0, best:parseInt(localStorage.getItem("cupmerge_best")||"0"),
  combo:0, comboT:0, fever:0, feverT:0,
  orders:[], currentTier:1, nextTier:1, held:null, incoming:null, aimX:220, cooldown:0,
  shake:0, highest:1, launched:0, merged:0,
  comboPop:0, feverPop:0,
  lang:localStorage.getItem("cupmerge_lang")||"zh",
};
function addCoins(n, x, y, color){
  n = Math.round(n); G.coins += n;
  if(G.coins > G.best){ G.best = G.coins; localStorage.setItem("cupmerge_best", String(G.best)); }
  G.floaters.push({x:x??220, y:y??200, text:"+"+n, life:1.1, t:0, color:color||"#ffd94a", size:20});
  G.comboPop = 1;
}
function schedule(delay, fn){ G.events.push({t:G.time+delay, fn}); }

/* ================= sprites ================= */
const Sprites = { imgs:{}, loaded:0 };
function loadSprites(){
  for(let t=1;t<=TIER_N;t++){
    const img = new Image();
    img.onload = ()=>{ Sprites.loaded++; };
    img.onerror = ()=>{ Sprites.loaded++; };
    img.src = "assets/sprites/tier-"+String(t).padStart(2,"0")+".png";
    Sprites.imgs[t] = img;
  }
}

/* ================= cups & physics ================= */
let cupId = 0;
function spawnCup(tier, x, y, vx=0, vy=0){
  const c = { id:++cupId, tier, x, y, vx, vy, r:tierRadius(tier), pr:tierRadius(tier)*PHYS_F,
    mass:tierMass(tier), age:0, sleep:false, sleepT:0, pop:0, squash:1, mergeCd:0 };
  G.cups.push(c);
  if(G.cups.length > 46){ // gentle cap: remove oldest sleeping tier-1
    const old = G.cups.find(c=>c.sleep && c.tier===1);
    if(old){ poof(old.x, old.y, 8, "#ffffff"); G.cups.splice(G.cups.indexOf(old),1); }
  }
  return c;
}
function weightedTier(){
  const r = Math.random();
  const maxT = Math.min(4, Math.max(2, G.highest));
  if(r < 0.42) return 1;
  if(r < 0.72) return 2;
  if(r < 0.90) return Math.min(3, maxT);
  return Math.min(4, maxT);
}
function freeSpot(x){
  x = clamp(x, TABLE.x+30, TABLE.x+TABLE.w-30);
  for(const c of G.cups){
    if(Math.abs(c.y - LAUNCH_Y) < 70 && Math.abs(c.x - x) < c.pr + 30){
      x = c.x + (c.pr + 32) * (x >= c.x ? 1 : -1);
      x = clamp(x, TABLE.x+30, TABLE.x+TABLE.w-30);
    }
  }
  return x;
}
function physics(dt){
  const cups = G.cups;
  for(const c of cups){
    if(c.mergeCd > 0) continue;
    c.age += dt;
    if(c.sleep) continue;
    // friction
    const f = Math.exp(-1.05*dt);
    c.vx *= f; c.vy *= f;
    c.x += c.vx*dt; c.y += c.vy*dt;
    const sp = Math.hypot(c.vx, c.vy);
    if(sp < 12){ c.sleepT += dt; if(c.sleepT > 0.35){ c.sleep=true; c.vx=c.vy=0; } }
    else c.sleepT = 0;
    // walls
    const L=TABLE.x+c.pr, R=TABLE.x+TABLE.w-c.pr, T=TABLE.y+c.pr, B=TABLE.y+TABLE.h-c.pr;
    if(c.x < L){ c.x=L; if(c.vx<0){ wallHit(c,-c.vx); c.vx=-c.vx*0.18; } }
    if(c.x > R){ c.x=R; if(c.vx>0){ wallHit(c,c.vx); c.vx=-c.vx*0.18; } }
    if(c.y < T){ c.y=T; if(c.vy<0){ wallHit(c,-c.vy); c.vy=-c.vy*0.18; } }
    if(c.y > B){ c.y=B; if(c.vy>0){ wallHit(c,c.vy); c.vy=-c.vy*0.18; } }
    c.vx *= 0.995; c.vy *= 0.995;
    c.squash += (1-c.squash)*Math.min(1, 10*dt);
  }
  // cup-cup collisions (2 relaxation passes)
  for(let pass=0; pass<2; pass++){
    for(let i=0;i<cups.length;i++) for(let j=i+1;j<cups.length;j++){
      const a=cups[i], b=cups[j];
      if(a.mergeCd>0 || b.mergeCd>0) continue;
      const dx=b.x-a.x, dy=b.y-a.y, rr=a.pr+b.pr;
      const d2=dx*dx+dy*dy;
      if(d2 >= rr*rr || d2 === 0) continue;
      const d=Math.sqrt(d2), nx=dx/d, ny=dy/d, overlap=rr-d;
      const tm=a.mass+b.mass;
      a.x-=nx*overlap*(b.mass/tm); a.y-=ny*overlap*(b.mass/tm);
      b.x+=nx*overlap*(a.mass/tm); b.y+=ny*overlap*(a.mass/tm);
      const rvx=b.vx-a.vx, rvy=b.vy-a.vy;
      const vn=rvx*nx+rvy*ny;
      if(vn < 0){
        const e=0.32, imp=-(1+e)*vn/(1/a.mass+1/b.mass);
        a.vx-=imp*nx/a.mass; a.vy-=imp*ny/a.mass;
        b.vx+=imp*nx/b.mass; b.vy+=imp*ny/b.mass;
        const impact=-vn;
        if(impact > 130){ AudioSys.clink(clamp(impact/900,0,1)); wake(a); wake(b); }
        if(impact > 260){ a.squash=0.8; b.squash=0.8; }
      }
    }
  }
  // re-clamp: collision de-overlap can shove cups (esp. sleeping ones) past the walls
  for(const c of cups){
    if(c.mergeCd>0) continue;
    const L2=TABLE.x+c.pr, R2=TABLE.x+TABLE.w-c.pr, T2=TABLE.y+c.pr, B2=TABLE.y+TABLE.h-c.pr;
    if(c.x<L2) c.x=L2; else if(c.x>R2) c.x=R2;
    if(c.y<T2) c.y=T2; else if(c.y>B2) c.y=B2;
  }
  checkMerges();
}
function wake(c){ if(c.sleep && c.mergeCd<=0){ c.sleep=false; c.sleepT=0; } }
function wallHit(c, speed){
  if(speed > 220){ AudioSys.play("thud", clamp(speed/900,0.15,0.6)); c.squash=0.84; }
  wake(c);
}
function checkMerges(){
  const cups=G.cups;
  for(let i=0;i<cups.length;i++) for(let j=i+1;j<cups.length;j++){
    const a=cups[i], b=cups[j];
    if(a.tier!==b.tier || a.mergeCd>0 || b.mergeCd>0) continue;
    if(a.age<0.15 || b.age<0.15) continue;
    const rr=a.pr+b.pr;
    if(dist2(a.x,a.y,b.x,b.y) > (rr+4)*(rr+4)) continue;
    doMerge(a,b); // first contact merges, like the original
  }
}
function doMerge(a,b){
  a.mergeCd=1; b.mergeCd=1; // flagged for removal
  const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, tier=a.tier;
  G.cups = G.cups.filter(c=>c!==a && c!==b);
  G.merged++;
  // combo
  if(G.time - G.comboT < 2.2) G.combo=Math.min(G.combo+1, 12); else G.combo=1;
  G.comboT = G.time;
  const cmult = Math.min(G.combo, 8);
  const feverOn = G.time < G.feverT;
  if(tier >= TIER_N){
    // MAX merge!
    addCoins(2500*cmult*(feverOn?2:1), mx, my, "#ffe27a");
    G.floaters.push({x:mx, y:my-40, text:"MAX!", life:1.6, t:0, color:"#ffe27a", size:34});
    confetti(mx, my, 46); G.shake = Math.max(G.shake, 14);
    AudioSys.play("fanfare", 0.9); AudioSys.play("fever", 0.7);
    return;
  }
  const nt = tier+1;
  const nc = spawnCup(nt, mx, my); nc.pop=0; nc.age=0;
  G.highest = Math.max(G.highest, nt);
  const gain = TIERS[nt].coin * cmult * (feverOn?2:1);
  addCoins(gain, mx, my-10);
  if(G.combo >= 2)
    G.floaters.push({x:mx, y:my-44, text:"COMBO x"+cmult, life:1.2, t:0, color:"#ff9d5c", size:22});
  // fever meter
  if(!feverOn){
    G.fever = Math.min(100, G.fever + nt*5);
    if(G.fever >= 100){ G.fever=0; G.feverT=G.time+12; G.feverPop=1;
      AudioSys.play("fever", 0.8);
      G.floaters.push({x:220, y:360, text:T("feverMsg"), life:1.8, t:0, color:"#ffd94a", size:30}); }
  }
  // juice
  burst(mx, my, nt, feverOn); ring(mx, my, nc.r);
  G.shake = Math.max(G.shake, 2 + nt*0.9);
  AudioSys.play("pop", 0.8, 1.15 - nt*0.045);
  AudioSys.clink(0.5);
  orderProgress(nt, mx, my);
  // chain check, staggered
  schedule(0.09, ()=>{
    for(const o of G.cups){
      if(o!==nc && o.tier===nt && o.mergeCd<=0 && nc.mergeCd<=0){
        const rr=nc.pr+o.pr;
        if(dist2(nc.x,nc.y,o.x,o.y) < (rr+8)*(rr+8)){ doMerge(nc,o); break; }
      }
    }
  });
}
// __MORE2__

/* ================= orders ================= */
function newOrder(){
  const maxT = Math.max(2, Math.min(G.highest+1, TIER_N));
  const tier = 2 + Math.floor(Math.random()*(maxT-1));
  const need = 2 + Math.floor(Math.random()*2);
  return { tier, need, have:0, payout: tier*need*20, born:G.time };
}
function orderProgress(nt, x, y){
  for(const o of G.orders){
    if(o.done || o.tier!==nt) continue;
    o.have++;
    AudioSys.play("coin", 0.5, 1.2);
    G.floaters.push({x:x+rand(-20,20), y:y-60, text:o.have+"/"+o.need, life:0.9, t:0, color:"#bfefff", size:18});
    if(!o.done && o.have>=o.need){
      o.done=true;
      addCoins(o.payout, x, y-70, "#7dff9a");
      G.floaters.push({x:220, y:300, text:T("orderDone")+o.payout, life:1.5, t:0, color:"#7dff9a", size:24});
      AudioSys.play("fanfare", 0.75);
      schedule(1.0, ()=>{ const i=G.orders.indexOf(o); if(i>=0) G.orders[i]=newOrder(); });
    }
  }
}

/* ================= particles ================= */
const PCOLORS = ["#ffd94a","#ff9d5c","#ffffff","#bfefff","#ffb3d9"];
function burst(x,y,tier,fever){
  const n = 10 + tier*2;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=rand(60,260);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:rand(.4,.9),t:0,
      size:rand(2,5),color:fever?"#ffd94a":PCOLORS[i%PCOLORS.length],grav:420});
  }
}
function ring(x,y,r){
  G.particles.push({ring:true,x,y,r0:r*0.4,r1:r*1.9,life:.35,t:0,color:"#ffffff"});
}
function poof(x,y,n,color){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=rand(30,120);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:rand(.3,.6),t:0,
      size:rand(3,7),color:color||"#ffffff",grav:120});
  }
}
function confetti(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=rand(80,380);
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-160,life:rand(.8,1.6),t:0,
      size:rand(3,6),color:PCOLORS[i%PCOLORS.length],grav:520,rect:true,rot:Math.random()*6,vr:rand(-8,8)});
  }
}
function updateFx(dt){
  for(const p of G.particles){
    p.t+=dt;
    if(p.ring) continue;
    p.vy += (p.grav||0)*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    if(p.rot!==undefined) p.rot += p.vr*dt;
  }
  G.particles = G.particles.filter(p=>p.t<p.life);
  for(const f of G.floaters){ f.t+=dt; f.y-=34*dt; }
  G.floaters = G.floaters.filter(f=>f.t<f.life);
  G.events = G.events.filter(e=>{ if(G.time>=e.t){ e.fn(); return false; } return true; });
  G.shake = Math.max(0, G.shake - 46*dt);
  G.comboPop = Math.max(0, G.comboPop - 3*dt);
  G.feverPop = Math.max(0, G.feverPop - 2*dt);
}

/* ================= input: flick to launch ================= */
function launchCup(tier, px, power, ang){
  const x = freeSpot(px);
  const c = spawnCup(tier, x, LAUNCH_Y);
  c.vx = Math.cos(ang)*power; c.vy = Math.sin(ang)*power;
  c.sleep=false; c.sleepT=0;
  G.cooldown = 0.35; G.launched++;
  AudioSys.play("whoosh", 0.55, rand(0.95,1.1));
  poof(x, LAUNCH_Y+18, 6, "#e8d9bd");
}
const TAP_POWER = 1060; // fixed launch power, straight up (faithful to original)
canvas.addEventListener("pointerdown", e=>{
  AudioSys.init(); AudioSys.resume();
  if(!G.running || G.paused) return;
  const p = toLogical(e.clientX, e.clientY);
  if(p.y > TABLE.y + TABLE.h - 150 && G.cooldown<=0 && !G.held){
    G.held = { x: clamp(p.x, TABLE.x+30, TABLE.x+TABLE.w-30), id: e.pointerId };
    G.aimX = G.held.x;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    AudioSys.play("click", 0.35, 1.3);
  }
  e.preventDefault();
},{passive:false});
canvas.addEventListener("pointermove", e=>{
  if(!G.held || e.pointerId!==G.held.id) return;
  const p = toLogical(e.clientX, e.clientY);
  G.held.x = clamp(p.x, TABLE.x+30, TABLE.x+TABLE.w-30);
  G.aimX = G.held.x;
  e.preventDefault();
},{passive:false});
function releaseHeld(e){
  if(!G.held || (e && e.pointerId!==G.held.id)) return;
  const x = G.held.x; G.held = null;
  launchCup(G.currentTier, x, TAP_POWER, -Math.PI/2);
  G.currentTier = G.nextTier; G.nextTier = weightedTier();
  G.aimX = x;
  // the cup that was in NEXT flies down to your hand
  G.incoming = { t:0, dur:0.22, tier:G.currentTier, fx:50, fy:90, tx:x, ty:LAUNCH_Y };
}
canvas.addEventListener("pointerup", releaseHeld);
canvas.addEventListener("pointercancel", ()=>{ G.held=null; });
document.addEventListener("touchmove", e=>e.preventDefault(), {passive:false});
document.addEventListener("gesturestart", e=>e.preventDefault());
document.addEventListener("dblclick", e=>e.preventDefault());

function reset(){
  G.cups=[]; G.particles=[]; G.floaters=[]; G.events=[];
  G.coins=0; G.combo=0; G.comboT=0; G.fever=0; G.feverT=0;
  G.orders=[newOrder(),newOrder(),newOrder()];
  G.currentTier=1; G.nextTier=weightedTier(); G.held=null; G.incoming=null; G.aimX=220;
  G.cooldown=0; G.shake=0; G.highest=1; G.launched=0; G.merged=0;
  // original starts with an empty table
}
function start(){
  AudioSys.init(); AudioSys.resume();
  reset(); G.running=true; G.paused=false;
  document.getElementById("titleScreen").classList.add("hidden");
  document.getElementById("pauseScreen").classList.add("hidden");
}

  if(!G.running) return;
  G.paused = p===undefined ? !G.paused : p;
  document.getElementById("pauseScreen").classList.toggle("hidden", !G.paused);
  AudioSys.play("click",.5);
}

/* ================= rendering ================= */
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,LH);
  g.addColorStop(0,"#0f3a45"); g.addColorStop(.5,"#14606b"); g.addColorStop(1,"#0c2b33");
  ctx.fillStyle=g; ctx.fillRect(0,0,LW,LH);
  // bokeh lights
  for(let i=0;i<7;i++){
    const bx=(i*137)%LW, by=(i*251)%LH, br=26+((i*53)%40);
    const rg=ctx.createRadialGradient(bx,by,0,bx,by,br);
    rg.addColorStop(0,"rgba(255,220,150,.10)"); rg.addColorStop(1,"rgba(255,220,150,0)");
    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(bx,by,br,0,7); ctx.fill();
  }
  // sand strip at bottom
  const sg=ctx.createLinearGradient(0,LH-90,0,LH);
  sg.addColorStop(0,"rgba(232,201,141,0)"); sg.addColorStop(1,"rgba(232,201,141,.35)");
  ctx.fillStyle=sg; ctx.fillRect(0,LH-90,LW,90);
}
function drawTable(){
  const {x,y,w,h}=TABLE;
  ctx.save();
  ctx.shadowColor="rgba(0,0,0,.45)"; ctx.shadowBlur=24; ctx.shadowOffsetY=6;
  const g=ctx.createLinearGradient(x,0,x+w,0);
  g.addColorStop(0,"#b57e48"); g.addColorStop(.5,"#d29a5e"); g.addColorStop(1,"#a9713f");
  ctx.fillStyle=g; rr(x,y,w,h,18); ctx.fill();
  ctx.restore();
  // planks
  ctx.save(); rr(x,y,w,h,18); ctx.clip();
  ctx.strokeStyle="rgba(120,70,30,.35)"; ctx.lineWidth=2;
  for(let py=y+52; py<y+h; py+=52){
    ctx.beginPath(); ctx.moveTo(x,py); ctx.lineTo(x+w,py); ctx.stroke();
  }
  // subtle grain
  ctx.strokeStyle="rgba(120,70,30,.12)"; ctx.lineWidth=1;
  for(let i=0;i<40;i++){
    const gx=x+((i*89)%w), gy=y+((i*167)%h);
    ctx.beginPath(); ctx.moveTo(gx,gy); ctx.lineTo(gx+26,gy+3); ctx.stroke();
  }
  // fever glow
  if(G.time < G.feverT){
    ctx.strokeStyle="rgba(255,215,90,.85)"; ctx.lineWidth=5;
    rr(x+3,y+3,w-6,h-6,15); ctx.stroke();
  }
  ctx.restore();
  // frame
  ctx.strokeStyle="#7c4f27"; ctx.lineWidth=4; rr(x,y,w,h,18); ctx.stroke();
  // launch line
  ctx.strokeStyle="rgba(255,255,255,.85)"; ctx.lineWidth=3; ctx.setLineDash([14,10]);
  ctx.beginPath(); ctx.moveTo(x+10,LAUNCH_Y); ctx.lineTo(x+w-10,LAUNCH_Y); ctx.stroke();
  ctx.setLineDash([]);
  // faint center aim guide
  ctx.strokeStyle="rgba(255,255,255,.25)"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(x+w/2,y+14); ctx.lineTo(x+w/2,LAUNCH_Y+30); ctx.stroke();
}
function drawCup(c){
  const img=Sprites.imgs[c.tier];
  const pop = c.pop<1 ? (c.pop<0.7 ? c.pop/0.7*1.18 : 1.18-(c.pop-0.7)/0.3*0.18) : 1;
  const sq = c.squash;
  const d = c.r*2*pop;
  drawShadow(c.x, c.y, c.r);
  ctx.save();
  ctx.translate(c.x, c.y); ctx.scale(2-sq, sq);
  if(img && img.complete && img.naturalWidth){
    ctx.drawImage(img, -d/2, -d/2, d, d);
  } else { // fallback circle
    ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(0,0,d/2,0,7); ctx.fill();
    ctx.fillStyle="#e08a3c"; ctx.font=`bold ${d*0.4}px sans-serif`;
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText(c.tier,0,0);
  }
  ctx.restore();
  // sleep hint: tiny zzz? skip
}
function drawParticles(){
  for(const p of G.particles){
    const k=1-p.t/p.life;
    if(p.ring){
      const r=p.r0+(p.r1-p.r0)*(p.t/p.life);
      ctx.strokeStyle=p.color; ctx.globalAlpha=k*0.9; ctx.lineWidth=3;
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,7); ctx.stroke(); ctx.globalAlpha=1;
    } else if(p.rect){
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
      ctx.globalAlpha=k; ctx.fillStyle=p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.7); ctx.restore(); ctx.globalAlpha=1;
    } else {
      ctx.globalAlpha=k; ctx.fillStyle=p.color;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*k+0.5,0,7); ctx.fill(); ctx.globalAlpha=1;
    }
  }
}
function drawFloaters(){
  ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const f of G.floaters){
    const k=1-f.t/f.life, a=k<0.7?k/0.7:1;
    ctx.globalAlpha=a;
    ctx.font=`900 ${f.size}px ui-rounded,"SF Pro Rounded",system-ui,sans-serif`;
    ctx.lineWidth=4; ctx.strokeStyle="rgba(60,30,10,.8)";
    ctx.strokeText(f.text,f.x,f.y); ctx.fillStyle=f.color; ctx.fillText(f.text,f.x,f.y);
    ctx.globalAlpha=1;
  }
}
function drawHUD(){
  // coins
  ctx.textAlign="left"; ctx.textBaseline="middle";
  const cp=1+G.comboPop*0.35;
  ctx.save(); ctx.translate(58,26); ctx.scale(cp,cp);
  ctx.fillStyle="#ffcf3f"; ctx.beginPath(); ctx.arc(0,0,15,0,7); ctx.fill();
  ctx.fillStyle="#e8a020"; ctx.beginPath(); ctx.arc(0,0,10,0,7); ctx.fill();
  ctx.fillStyle="#ffcf3f"; ctx.font=FB(13); ctx.textAlign="center";
  ctx.fillText("¢",0,1); ctx.restore();
  ctx.fillStyle="#fff8ec"; ctx.font=FB(26);
  ctx.fillText(String(G.coins), 82, 27);
  ctx.fillStyle="rgba(255,248,236,.65)"; ctx.font=FB(13,600);
  ctx.fillText(T("best")+" "+G.best, 82, 50);
  // combo badge
  if(G.combo>=2 && G.time-G.comboT<2.2){
    const bp=1+G.comboPop*0.5;
    ctx.save(); ctx.translate(370,26); ctx.scale(bp,bp);
    ctx.fillStyle="#ff9d5c"; rr(-52,-17,104,34,17); ctx.fill();

  }
  // fever bar / badge
  if(G.time < G.feverT){
    const left=G.feverT-G.time;
    ctx.save(); ctx.translate(220,26);
    ctx.fillStyle="#ffd94a"; rr(-70,-17,140,34,17); ctx.fill();
    ctx.fillStyle="#5a3410"; ctx.font=FB(16); ctx.textAlign="center";
    ctx.fillText("FEVER "+left.toFixed(0)+"s",0,1); ctx.restore();
  } else if(G.fever>0){
    const hot=G.fever>=70, pulse=hot?1+Math.sin(G.time*10)*0.07:1;
    ctx.save(); ctx.translate(220,19); ctx.scale(pulse,pulse);
    ctx.font=FB(15); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("⚡",-80,1);
    ctx.fillStyle="rgba(0,0,0,.35)"; rr(-70,-5,140,10,5); ctx.fill();
    if(G.fever>1){ ctx.fillStyle=hot?"#fff3b0":"#ffd94a"; rr(-68,-3,136*G.fever/100,6,3); ctx.fill(); }
    ctx.restore();
  }
  // section captions
  ctx.fillStyle="rgba(255,248,236,.62)"; ctx.font=FB(11,600); ctx.textAlign="center";
  ctx.fillText(T("next"), 50, 57);
  ctx.fillText(T("orders"), 268, 57);
  // NEXT card (distinct accent)
  ctx.fillStyle="#fff3df"; rr(12,62,76,56,12); ctx.fill();
  ctx.strokeStyle="#ff9f2e"; ctx.lineWidth=3; rr(12,62,76,56,12); ctx.stroke();
  drawMini(G.nextTier, 50, 90, 32);
  // divider
  ctx.strokeStyle="rgba(255,255,255,.28)"; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(97,62); ctx.lineTo(97,118); ctx.stroke();
  // orders
  let ox=109;
  for(const o of G.orders){
    const done=o.done;
    ctx.fillStyle=done?"rgba(160,255,170,.92)":"rgba(255,248,236,.94)";
    rr(ox,62,100,56,12); ctx.fill();
    ctx.strokeStyle=done?"#4caf50":"#e0d2b4"; ctx.lineWidth=2; rr(ox,62,100,56,12); ctx.stroke();
    drawMini(o.tier, ox+23, 90, 26);
    ctx.fillStyle="#6b4a2f"; ctx.font=FB(14); ctx.textAlign="left";
    ctx.fillText(o.have+"/"+o.need, ox+42, 83);
    ctx.fillStyle="#b8862f"; ctx.font=FB(13);
    ctx.fillText("+"+o.payout, ox+42, 103);
    if(done){ ctx.fillStyle="#2e7d32"; ctx.font="900 20px system-ui"; ctx.fillText("✓",ox+84,74); }
    ox+=106;
  }
  // tier bar
  const bx=16, bw=LW-32, bh=56, by=LH-bh-12;
  ctx.fillStyle="rgba(20,60,50,.85)"; rr(bx,by,bw,bh,16); ctx.fill();
  ctx.strokeStyle="#7ed957"; ctx.lineWidth=2; rr(bx,by,bw,bh,16); ctx.stroke();
  const slot=bw/TIER_N;
  ctx.textAlign="center";
  for(let t=1;t<=TIER_N;t++){
    const cx=bx+slot*(t-0.5);
    const reached=t<=G.highest;
    ctx.globalAlpha=reached?1:0.28;
    drawMini(t, cx, by+bh/2-4, 26);
    ctx.globalAlpha=1;
    if(t<TIER_N){
      ctx.fillStyle=t<G.highest?"#7ed957":"rgba(255,255,255,.3)";
      const ax=bx+slot*t;
      ctx.beginPath(); ctx.moveTo(ax-7,by+bh/2-4); ctx.lineTo(ax+7,by+bh/2-4);
      ctx.lineTo(ax,by+bh/2+4); ctx.closePath(); ctx.fill();
    }
  }
  // fever hint under bar? no space — skip
}
function drawMini(tier,x,y,size){
  const img=Sprites.imgs[tier];
  if(img && img.complete && img.naturalWidth) ctx.drawImage(img,x-size/2,y-size/2,size,size);
  else { ctx.fillStyle="#fff"; ctx.beginPath(); ctx.arc(x,y,size/2,0,7); ctx.fill(); }
}
function drawHeld(){
  if(!G.running || G.paused) return;
  const tier=G.currentTier, img=Sprites.imgs[tier], r=tierRadius(tier);
  let x=G.aimX, y=LAUNCH_Y, s=1;
  if(G.incoming){
    // NEXT -> hand fly-in
    const k=easeOutCubic(clamp(G.incoming.t/G.incoming.dur,0,1));
    x=lerp(G.incoming.fx,G.incoming.tx,k);
    y=lerp(G.incoming.fy,G.incoming.ty,k)-Math.sin(k*Math.PI)*36;
    s=0.55+0.45*k;
  } else if(G.held){
    x=G.held.x; s=1+Math.sin(G.time*6)*0.04;
  } else {
    y=LAUNCH_Y+Math.sin(G.time*2.2)*3; s=1+Math.sin(G.time*2.2)*0.02;
  }
  const d=r*2*s;
  drawShadow(x, LAUNCH_Y, r*s);
  if(img && img.complete && img.naturalWidth)
    ctx.drawImage(img, x-d/2, y-d/2, d, d);
  if(!G.held && !G.incoming && G.cooldown<=0 && G.launched===0){
    const t=T("hint");
    ctx.font=FB(14,600); ctx.textAlign="center";
    const tw=ctx.measureText(t).width;
    ctx.fillStyle="rgba(0,0,0,.3)"; rr((LW-tw)/2-12, LAUNCH_Y+50, tw+24, 26, 13); ctx.fill();
    ctx.fillStyle="rgba(255,255,255,.9)"; ctx.fillText(t, LW/2, LAUNCH_Y+64);
  }
}

/* ================= main loop ================= */
let lastT=0;
function frame(ts){
  requestAnimationFrame(frame);
  const now=ts/1000;
  let dt=Math.min(0.05, now-(lastT||now)); lastT=now;
  if(G.running && !G.paused){
    G.time+=dt;
    G.cooldown=Math.max(0,G.cooldown-dt);
    if(G.incoming){ G.incoming.t+=dt;
      if(G.incoming.t>=G.incoming.dur){ G.incoming=null; AudioSys.play("click",0.22,1.7); } }
    const sub=2, sdt=dt/sub;
    for(let i=0;i<sub;i++) physics(sdt);
    for(const c of G.cups) if(c.pop<1) c.pop=Math.min(1,c.pop+dt*5.5);
    updateFx(dt);
    if(window.__autotest) autoTest(dt);
  }
  ctx.setTransform(DPR*SCALE,0,0,DPR*SCALE,0,0);
  if(G.shake>0) ctx.translate(rand(-G.shake,G.shake)*0.5, rand(-G.shake,G.shake)*0.5);
  drawBG(); drawTable();
  const sorted=[...G.cups].sort((a,b)=>a.y-b.y);
  for(const c of sorted) drawCup(c);
  drawParticles(); drawFloaters(); drawHUD(); drawHeld();
}
// autotest hook for QA (?autotest=1)
let atT=0;
function autoTest(dt){
  atT+=dt;
  if(atT>0.7 && G.cooldown<=0){
    atT=0;
    launchCup(weightedTier(), rand(TABLE.x+60,TABLE.x+TABLE.w-60), 1060, -Math.PI/2);
  }
}

  document.getElementById("titleScreen").classList.add("hidden");
  reset(); G.running=true;
}
